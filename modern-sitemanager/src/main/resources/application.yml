spring:
  application:
    name: modern-sitemanager
  
  datasource:
    url: jdbc:mysql://localhost:3306/sitemanager_db?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false
    username: ${DB_USERNAME:sitemanager_user}
    password: ${DB_PASSWORD:changeit_in_production}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: SiteManagerHikariPool
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  security:
    filter:
      order: -100

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
  http2:
    enabled: true
  forward-headers-strategy: framework

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:change_this_secret_key_in_production_minimum_32_characters_long}
  expiration-ms: 86400000  # 24 hours
  refresh-expiration-ms: 604800000  # 7 days
  issuer: sitemanager-api
  audience: sitemanager-client

# Security Configuration
security:
  password:
    strength: 12  # BCrypt strength
  session:
    timeout-minutes: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With
    allow-credentials: true
  rate-limit:
    enabled: true
    requests-per-minute: 60
    login-attempts: 5

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      path-prefix: /actuator
  endpoint:
    health:
      show-details: when_authorized
  security:
    enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.sitemanager: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/sitemanager.log
    max-size: 10MB
    max-history: 30

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha

# File Upload Configuration
spring.servlet:
  multipart:
    max-file-size: 10MB
    max-request-size: 20MB
    enabled: true
